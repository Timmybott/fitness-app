# Builds the iOS app on a free GitHub macOS runner (no Mac or paid Apple account needed).
# The result is an ad-hoc signed .ipa (entitlements like HealthKit embedded) that Sideloadly
# re-signs with a free Apple ID on Windows.
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fitness-app/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # macos-26 runners are often unavailable on the free tier; macos-15 ships Xcode 26 as well.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fitness-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fitness-app/package-lock.json

      # The iOS 26 SDK (Liquid Glass tab bar) needs Xcode 26; pick the newest one installed.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build (unsigned, Release with embedded JS bundle)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -n 80
          test -d "build/Build/Products/Release-iphoneos/$SCHEME.app"

      - name: Ad-hoc sign with entitlements and package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/$SCHEME.app"
          ENT="ios/$SCHEME/$SCHEME.entitlements"
          EXE=$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")
          cat "$ENT"
          ls -la "$APP" | head -40
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          # Sideloadly keeps the entitlements of the existing signature, so they must be embedded here.
          # codesign can reject unsigned app bundles ("bundle format unrecognized"); ldid signs the
          # executable directly and is the usual tool for sideloading.
          if ! codesign --force --sign - --entitlements "$ENT" "$APP"; then
            echo "codesign failed, falling back to ldid"
            brew install ldid
            ldid -S"$ENT" "$APP/$EXE"
          fi
          echo "Embedded entitlements:"
          codesign -d --entitlements - "$APP/$EXE" || ldid -e "$APP/$EXE"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry Fitness.ipa Payload
          ls -lh Fitness.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-ipa
          path: fitness-app/Fitness.ipa
          retention-days: 30
