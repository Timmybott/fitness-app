# Builds the iOS app on a free GitHub macOS runner (no Mac or paid Apple account needed).
# The result is an ad-hoc signed .ipa (entitlements like HealthKit embedded) that Sideloadly
# re-signs with a free Apple ID on Windows.
name: iOS Build

# Manual only: JS changes ship as over-the-air updates, a new build is only needed for native changes.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner. Expo SDK 58 needs Xcode newer than 26.3, which only macos-26 has.
        type: choice
        default: macos-26
        options: [macos-26, macos-15, macos-15-intel]

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fitness-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fitness-app/package-lock.json

      # Expo SDK 58 needs a recent Swift compiler (Xcode > 26.3); pick the newest stable Xcode installed.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build (unsigned, Release with embedded JS bundle)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          # Full log goes to a file (uploaded on failure); only errors and the tail are printed.
          if ! xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1; then
            echo "::group::Errors"
            grep -E "error:|fatal error|\*\* BUILD FAILED|The following build commands failed" -A3 xcodebuild.log | head -150
            echo "::endgroup::"
            tail -n 60 xcodebuild.log
            exit 1
          fi
          tail -n 5 xcodebuild.log
          test -f "build/Build/Products/Release-iphoneos/$SCHEME.app/Info.plist"

      - name: Ad-hoc sign with entitlements and package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/$SCHEME.app"
          ENT="ios/$SCHEME/$SCHEME.entitlements"
          EXE=$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")
          cat "$ENT"
          ls -la "$APP" | head -40
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          # Sideloadly keeps the entitlements of the existing signature, so they must be embedded here.
          # codesign can reject unsigned app bundles ("bundle format unrecognized"); ldid signs the
          # executable directly and is the usual tool for sideloading.
          if ! codesign --force --sign - --entitlements "$ENT" "$APP"; then
            echo "codesign failed, falling back to ldid"
            brew install ldid
            ldid -S"$ENT" "$APP/$EXE"
          fi
          echo "Embedded entitlements:"
          codesign -d --entitlements - "$APP/$EXE" || ldid -e "$APP/$EXE"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry Fitness.ipa Payload
          ls -lh Fitness.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: fitness-app/xcodebuild.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-ipa
          path: fitness-app/Fitness.ipa
          retention-days: 30
